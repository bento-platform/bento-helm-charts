apiVersion: v1
kind: Service
metadata:
  name: {{ include "litestream-svc.fullname" . }}
  labels:
    {{- include "litestream-svc.labels" . | nindent 4 }}
spec:
  # Headless: required so this Service can be used as the StatefulSet's
  # governing serviceName (stable per-pod DNS). With a single replica this is
  # also fine as the normal way clients reach the service.
  clusterIP: None
  selector:
    {{- include "litestream-svc.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
