image:
  repository: ghcr.io/bento-platform/bento_public
  tag: "0.31.0"

service:
  port: 5000

livenessProbe:
  httpGet:
    path: /service-info
    port: http
readinessProbe:
  httpGet:
    path: /service-info
    port: http
startupProbe:
  httpGet:
    path: /service-info
    port: http
  failureThreshold: 30
  periodSeconds: 5

env:
  - name: BENTO_UID
    value: "1000"
  - name: BENTO_PUBLIC_SERVICE_ID
    value: "1000"
  - name: BENTO_PUBLIC_CLIENT_NAME
    value: "dummy"
  - name: BENTO_PUBLIC_PORTAL_URL
    value: "http://dummy"
  - name: BENTO_PUBLIC_TRANSLATED
    value: "false"
  - name: BENTO_PUBLIC_SHOW_HEADER_TITLE
    value: "false"
  - name: BENTO_PUBLIC_SHOW_PORTAL_LINK
    value: "false"
  - name: BENTO_PUBLIC_SHOW_SIGN_IN
    value: "false"
  - name: BENTO_PUBLIC_FORCE_CATALOGUE
    value: "false"
  - name: BENTO_BEACON_UI_ENABLED
    value: "false"
  - name: BENTO_BEACON_NETWORK_ENABLED
    value: "false"
  - name: BEACON_URL
    value: "http://dummy"
  - name: BENTO_PUBLIC_URL
    value: "http://dummy"
  - name: BENTO_PUBLIC_PORT
    value: "5000"
  - name: OPENID_CONFIG_URL
    value: "http://dummy"
  - name: CLIENT_ID
    value: "1000"


configMap:
  enabled: true
  binaryData:
    branding.png: 
    branding.lightbg.png: 
    icon_small.png: 

volumes:
  - name: translations
    emptyDir: {}
  - name: about-pages
    emptyDir: {}

volumeMounts:
  - name: translations
    mountPath: /bento-public/dist/public/locales
  - name: about-pages
    mountPath: /bento-public/dist/public