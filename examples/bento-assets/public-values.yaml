---
image:
  repository: ghcr.io/bento-platform/bento_public
  tag: "1.1.0"

service:
  port: 5000

env:
  - name: BENTO_UID
    value: "1000"
  - name: BENTO_PUBLIC_SERVICE_ID
    value: "bentov2-public"
  - name: BENTO_PUBLIC_CLIENT_NAME
    value: "BentoPublicDev"
  - name: BENTO_PUBLIC_PORTAL_URL
    value: "https://portal.bento.k8s.local"
  - name: BENTO_PUBLIC_TRANSLATED
    value: "true"
  - name: BENTO_PUBLIC_SHOW_HEADER_TITLE
    value: "true"
  - name: BENTO_PUBLIC_SHOW_PORTAL_LINK
    value: "true"
  - name: BENTO_PUBLIC_SHOW_SIGN_IN
    value: "true"
  - name: BENTO_PUBLIC_FORCE_CATALOGUE
    value: "false"
  - name: BENTO_PUBLIC_PCGL_MODE
    value: "false"
  - name: BENTO_BEACON_UI_ENABLED
    value: "true"
  - name: BENTO_BEACON_NETWORK_ENABLED
    value: "false"
  - name: BEACON_URL
    value: "https://bento.k8s.local/api/beacon"
  - name: BENTO_PUBLIC_URL
    value: "https://bento.k8s.local"
  - name: BENTO_PUBLIC_PORT
    value: "5000"
  - name: OPENID_CONFIG_URL
    value: "https://auth.bento.k8s.local/realms/bentov2/.well-known/openid-configuration"
  - name: CLIENT_ID
    value: "local_bentov2"

assets:
  enabled: true
  image:
    repository: ghcr.io/bento-platform/bento-assets-dev
    # TODO: pin to a release (e.g. "26.0.0") once bento_assets publishes one
    tag: "sha-96c6190"
  service: public
  mountPath: /bento-public/dist/public
  # The dev instance ships all of these, French ones included
  files:
    - en_about.html
    - fr_about.html
    - assets/branding.png
    - assets/branding.fr.png
    - assets/branding.lightbg.png
    - assets/branding.lightbg.fr.png
    - assets/icon_small.png
    - styles/instance.css
    - locales/en/translation_en.json
    - locales/fr/translation_fr.json
