---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: infra-addons
  namespace: argocd

spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc

  project: default

  source:
    path: deployment/infra/
    repoURL: https://github.com/bento-platform/bento-helm-charts.git
    # TODO: change to HEAD when ready to merge
    targetRevision: 21-madr-deployment-structure

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
