---
image:
  repository: ghcr.io/bento-platform/bento_authorization_service
  tag: "0.13.0"

service:
  port: 5000

# The stateless-svc Chart has no config checksum annotation, so editing the
# ConfigMap below does not roll the pods. Bump this when static_data.json
# changes. authz only reads the file at startup, so a restart is required.
podAnnotations:
  bento.ca/static-data-revision: "1"

env:
  - name: DATABASE_URI
    valueFrom:
      secretKeyRef:
        name: authz-db-app
        key: uri
  - name: INTERNAL_PORT
    value: "5000"
  # The IdP manager verifies TLS unless debug is on (it does not read
  # BENTO_VALIDATE_SSL). The dev CA is trusted through the bundle below.
  - name: BENTO_DEBUG
    value: "False"
  - name: OPENID_CONFIG_URL
    value: "https://auth.bento.k8s.local/realms/bentov2/.well-known/openid-configuration"
  - name: CORS_ORIGINS
    value: "*"
  - name: SERVICE_URL_BASE_PATH
    value: "https://bento.k8s.local/api/authorization"
  - name: JWT_ACCESS_TOKENS
    value: "True"
  # Static grants/groups, mounted from the configMap below
  - name: STATIC_AUTHZ_DATA_PATH
    value: "/etc/bento/static_data.json"
  # LOCAL DEV ONLY. Trust the cert-manager dev root CA (plus public roots),
  # mounted below. See docs/dns-and-tls-local-vs-prod.md.
  - name: SSL_CERT_FILE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: REQUESTS_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: CURL_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"

configMap:
  enabled: true
  data:
    # Immutable grants loaded at startup, following the authz GrantModel
    # schema (expiry is required, null for none). They match the
    # "Configure permissions" steps in docs/argocd-gitops.md. The test user's
    # superuser grant stays manual: its Keycloak sub is generated at runtime.
    #
    # Permission names are not validated on load; a typo is silently ignored.
    # See bento_lib/auth/permissions.py for valid values.
    static_data.json: |
      {
        "grants": [
          {
            "subject": {
              "iss": "https://auth.bento.k8s.local/realms/bentov2",
              "client": "wes"
            },
            "resource": {"everything": true},
            "expiry": null,
            "notes": "WES client, private portal access",
            "permissions": ["view:private_portal"]
          },
          {
            "subject": {
              "iss": "https://auth.bento.k8s.local/realms/bentov2",
              "client": "wes"
            },
            "resource": {"everything": true},
            "expiry": null,
            "notes": "WES client, data and reference material ingestion",
            "permissions": [
              "query:data",
              "ingest:data",
              "ingest:reference_material",
              "delete:reference_material",
              "view:drop_box"
            ]
          },
          {
            "subject": {
              "iss": "https://auth.bento.k8s.local/realms/bentov2",
              "client": "aggregation"
            },
            "resource": {"everything": true},
            "expiry": null,
            "notes": "Aggregation and Beacon client",
            "permissions": ["query:data", "view:private_portal"]
          },
          {
            "subject": {"everyone": true},
            "resource": {"everything": true},
            "expiry": null,
            "notes": "Public data access: counts",
            "permissions": [
              "query:project_level_counts",
              "query:dataset_level_counts"
            ]
          },
          {
            "subject": {
              "iss": "https://auth.bento.k8s.local/realms/bentov2",
              "client": "local_bentov2"
            },
            "resource": {"everything": true},
            "expiry": null,
            "notes": "Portal access for all users in the realm",
            "permissions": ["view:private_portal"]
          }
        ],
        "groups": []
      }

volumes:
  - name: bento-static-data
    configMap:
      name: authz-stateless-svc
  # LOCAL DEV ONLY. Dev CA bundle synced by trust-manager
  # (deployment/platform/cert-manager/trust-bundle.yaml)
  - name: bento-ca-bundle
    configMap:
      name: bento-ca-bundle
volumeMounts:
  - name: bento-static-data
    mountPath: /etc/bento
    readOnly: true
  - name: bento-ca-bundle
    mountPath: /etc/ssl/bento
    readOnly: true

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      sectionName: root
      namespace: envoy-gateway-system
  hostnames:
    - bento.k8s.local
# Leave backendRefs to be templated by the Helm Chart
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/authorization
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
