---
image:
  repository: ghcr.io/bento-platform/bento_authorization_service
  tag: "0.12.1"

service:
  port: 5000

env:
  - name: DATABASE_URI
    valueFrom:
      secretKeyRef:
        name: authz-db-app
        key: uri
  - name: INTERNAL_PORT
    value: "5000"
  # LOCAL DEV ONLY. The IdP manager verifies TLS unless debug is on (it does
  # not read BENTO_VALIDATE_SSL), and pods do not trust the cert-manager dev
  # CA, so fetching the OpenID config from auth.bento.k8s.local fails and
  # every /policy/evaluate returns 500. Set back to "False" in any cluster
  # with a real CA. See docs/dns-and-tls-local-vs-prod.md.
  - name: BENTO_DEBUG
    value: "True"
  - name: OPENID_CONFIG_URL
    value: "https://auth.bento.k8s.local/realms/bentov2/.well-known/openid-configuration"
  - name: CORS_ORIGINS
    value: "*"
  - name: SERVICE_URL_BASE_PATH
    value: "https://bento.k8s.local/api/authorization"

# Path routing on the apex listener. The Chart does not strip the prefix,
# hence the URLRewrite filter.
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      sectionName: root
      namespace: envoy-gateway-system
  hostnames:
    - bento.k8s.local
# Leave backendRefs to be templated by the Helm Chart
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/authorization
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
