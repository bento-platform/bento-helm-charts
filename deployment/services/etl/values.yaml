---
# Bento ETL: extracts raw data from S3, transforms it into Bento data types and
# loads it into Katsu. See https://github.com/bento-platform/bento/blob/main/docs/etl.md
image:
  repository: ghcr.io/bento-platform/bento_etl
  # Pull request image, as in bento's etc/bento.env
  tag: "pr-18"

service:
  port: 5000
  targetPort: 5000

# Job status database (SQLite)
persistence:
  mountPath: /etl/data
  storageClassName: standard
  accessModes:
    - ReadWriteOnce
  size: 1Gi

sqlite:
  databasePath: /etl/data/bento_etl.db

litestream:
  replica:
    url: "s3://etl-litestream/db"
    endpoint: "http://garage.default.svc.cluster.local:3900"
    forcePathStyle: true
    region: "garage"
  credentials:
    existingSecret: "etl-litestream-creds"

# LOCAL DEV ONLY. Dev CA bundle synced by trust-manager
# (deployment/platform/cert-manager/trust-bundle.yaml)
volumes:
  - name: bento-ca-bundle
    configMap:
      name: bento-ca-bundle
volumeMounts:
  - name: bento-ca-bundle
    mountPath: /etc/ssl/bento
    readOnly: true

env:
  - name: BENTO_UID
    value: "1000"
  - name: BENTO_DEBUG
    value: "False"
  - name: INTERNAL_PORT
    value: "5000"
  - name: CORS_ORIGINS
    value: "https://bento.k8s.local;https://portal.bento.k8s.local"

  # Authz. ETL calls Katsu, the IdP and the authorization service through the
  # gateway (public URLs), as in Docker Compose. The trailing slash is kept
  # from bento's BENTO_AUTHZ_SERVICE_URL.
  - name: BENTO_AUTHZ_ENABLED
    value: "True"
  - name: BENTO_AUTHZ_SERVICE_URL
    value: "https://bento.k8s.local/api/authorization/"
  - name: BENTO_OPENID_CONFIG_URL
    value: "https://auth.bento.k8s.local/realms/bentov2/.well-known/openid-configuration"

  # OAuth2 client (client credentials) created by bentoctl init-auth
  # (deployment/platform/keycloak/init-auth-job.yaml), which writes the
  # etl-oidc-secret Secret. Its "id" key is the Keycloak internal client UUID,
  # not the client ID, so the client ID is set here directly.
  # Grants for this client: deployment/services/authz/values.yaml
  - name: ETL_CLIENT_ID
    value: "etl"
  - name: ETL_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: etl-oidc-secret
        key: secret

  # Loader target
  - name: KATSU_URL
    value: "https://bento.k8s.local/api/metadata/"

  # Job status database, under persistence.mountPath (replicated by Litestream)
  - name: DB_NAME
    value: "/etl/data/bento_etl.db"

  # S3 store, from the GarageKey Secret (deployment/platform/garage/etl-bucket-key.yaml).
  # The endpoint is Garage's in-cluster plain HTTP address: ETL's S3 client
  # always validates TLS certificates.
  - name: S3_BUCKET
    value: "etl"
  - name: AWS_ENDPOINT_URL_S3
    valueFrom:
      secretKeyRef:
        name: etl-key
        key: endpoint
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: etl-key
        key: region
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: etl-key
        key: access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: etl-key
        key: secret-access-key

  # LOCAL DEV ONLY. Trust the cert-manager dev root CA (plus public roots),
  # mounted above. See docs/dns-and-tls-local-vs-prod.md.
  - name: SSL_CERT_FILE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: REQUESTS_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: CURL_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"

livenessProbe:
  httpGet:
    path: /service-info
    port: http
    httpHeaders:
      - name: Host
        value: localhost
readinessProbe:
  httpGet:
    path: /service-info
    port: http
    httpHeaders:
      - name: Host
        value: localhost
startupProbe:
  httpGet:
    path: /service-info
    port: http
    httpHeaders:
      - name: Host
        value: localhost
  failureThreshold: 30
  periodSeconds: 5

# No HTTPRoute: ETL is not routed by the gateway, since job submission is not
# authenticated yet. Submit jobs from inside the cluster, e.g.:
#   kubectl port-forward svc/etl-litestream-svc 6400:5000
#   curl -X POST http://localhost:6400/jobs -H 'Content-Type: application/json' -d '...'
httpRoute:
  enabled: false
