image:
  repository: ghcr.io/bento-platform/bento_drop_box_service
  # tag: "2.1.6"
  tag: "pr-116"

service:
  port: 5000

env:
  - name: SERVICE_URL_BASE_PATH
    value: "https://bento.k8s.local/api/drop-box"
  - name: BENTO_AUTHZ_SERVICE_URL
    value: "http://authz-stateless-svc.default.svc.cluster.local:5000"
  - name: OPENID_CONFIG_URL
    value: "https://auth.bento.k8s.local/realms/bentov2/.well-known/openid-configuration"
  - name: CORS_ORIGINS
    value: "https://portal.bento.k8s.local"
  - name: LOG_LEVEL
    value: "info"
  - name: AWS_ENDPOINT_URL_S3
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: endpoint
  - name: AWS_DEFAULT_REGION
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: region
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: access-key-id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: secret-access-key
  # - name: S3_VALIDATE_SSL
  #   value: "False"
  - name: S3_BUCKET
    value: "drop-box"
  # LOCAL DEV ONLY. Trust the cert-manager dev root CA (plus public roots),
  # mounted below. See docs/dns-and-tls-local-vs-prod.md.
  - name: SSL_CERT_FILE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: REQUESTS_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: CURL_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"
  - name: AWS_CA_BUNDLE
    value: "/etc/ssl/bento/ca-certificates.crt"

# LOCAL DEV ONLY. Dev CA bundle synced by trust-manager
# (deployment/platform/cert-manager/trust-bundle.yaml)
volumes:
  - name: bento-ca-bundle
    configMap:
      name: bento-ca-bundle
volumeMounts:
  - name: bento-ca-bundle
    mountPath: /etc/ssl/bento
    readOnly: true

httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      sectionName: root
      namespace: envoy-gateway-system
  hostnames:
    - bento.k8s.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/drop-box
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
