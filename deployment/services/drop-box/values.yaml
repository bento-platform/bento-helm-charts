image:
  repository: ghcr.io/bento-platform/bento_drop_box_service
  # tag: "2.1.4"
  tag: "pr-116"

service:
  port: 5000

env:
  - name: SERVICE_URL_BASE_PATH
    value: "https://bento.k8s.local/api/drop-box"
  - name: BENTO_AUTHZ_SERVICE_URL
    value: "http://authz-stateless-svc.default.svc.cluster.local:5000"
  - name: OPENID_CONFIG_URL
    value: "https://auth.bento.k8s.local/realms/bentov2/.well-known/openid-configuration"
  - name: CORS_ORIGINS
    value: "https://portal.bento.k8s.local"
  - name: LOG_LEVEL
    value: "info"
  - name: AWS_S3_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: endpoint
  - name: AWS_S3_BUCKET
    value: "drop-box"
  - name: AWS_S3_REGION_NAME
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: region
  - name: AWS_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: access-key-id
  - name: AWS_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: drop-box-key
        key: secret-access-key
  - name: S3_VALIDATE_SSL
    value: "False"

# Path routing on the apex listener. The Chart does not strip the prefix,
# hence the URLRewrite filter.
httpRoute:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
      sectionName: root
      namespace: envoy-gateway-system
  hostnames:
    - bento.k8s.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/drop-box
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
