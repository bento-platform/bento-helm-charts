---
# Raises Envoy's default 15s route timeout for every route on the Gateway.
# Katsu ingests (~95s for ~2.6k phenopackets) and large Drop-Box/DRS
# transfers exceed 15s; Envoy then answers 504 "upstream request timeout"
# while the backend keeps working. A route-targeted BackendTrafficPolicy
# takes precedence over this one if a service needs a different value.
# See docs/dns-and-tls-local-vs-prod.md.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gateway-timeouts
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
  timeout:
    http:
      # Time allowed for the entire response. Going above 300s also requires
      # streamIdleTimeout (Envoy defaults to 5 minutes)
      requestTimeout: 300s
