---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: dev-ca-issuer
spec:
  gatewayClassName: eg
  listeners:
    - name: default
      hostname: "*.bento.k8s.local"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: "bento-k8s-local-tls"
    - name: root
      hostname: "bento.k8s.local"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: "bento-k8s-local-tls"
