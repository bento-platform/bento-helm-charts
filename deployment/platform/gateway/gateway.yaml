---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: gateway-infra
  annotations:
    cert-manager.io/issuer: dev-ca-issuer
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
    - name: default
      hostname: "*.exampledomain.example"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: "exampledomain-example-tls"
