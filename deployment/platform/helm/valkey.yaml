---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  name: valkey
  namespace: argocd

spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc

  project: default

  source:
    chart: valkey
    repoURL: https://valkey-io.github.io/valkey-helm
    targetRevision: 0.10.0
    helm:
      releaseName: valkey
      valuesObject:
        auth:
          enabled: false

        replica:
          enabled: false

        dataStorage:
          enabled: false

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
