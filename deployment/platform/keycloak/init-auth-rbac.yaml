apiVersion: v1
kind: ServiceAccount
metadata:
  name: bentoctl-init-auth
  namespace: keycloak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bentoctl-init-auth-secrets
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bentoctl-init-auth-secrets
  namespace: default
subjects:
  - kind: ServiceAccount
    name: bentoctl-init-auth
    namespace: keycloak
roleRef:
  kind: Role
  name: bentoctl-init-auth-secrets
  apiGroup: rbac.authorization.k8s.io