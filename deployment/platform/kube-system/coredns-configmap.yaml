---
# Split-horizon DNS: in-cluster lookups of bento.k8s.local and
# *.bento.k8s.local resolve to the Gateway's Envoy Service ClusterIP
# (bento-gateway, see envoy-gateway-system/envoy-proxy.yaml), so
# service-to-service calls to public URLs go straight to Envoy instead of
# failing to resolve or hairpinning through the LoadBalancer.
# See docs/dns-and-tls-local-vs-prod.md.
#
# This owns the WHOLE Corefile, copied from kind's default (k8s v1.34,
# CoreDNS v1.12.1) with only the rewrite block added. When upgrading the
# cluster, diff it against the new default Corefile.
#
# Prune/Delete are disabled so removing this app never deletes cluster DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        rewrite stop {
           name regex ^([a-z0-9-]+\.)*bento\.k8s\.local\.$ bento-gateway.envoy-gateway-system.svc.cluster.local.
           answer auto
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
